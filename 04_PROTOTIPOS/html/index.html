<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Prototipo UI/UX EsSalud</title>
<style>body{font-family:Arial;background:#f5f7fb;margin:0;color:#0f172a}header{background:#075985;color:white;padding:24px 40px}main{padding:30px 40px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}.card{background:white;border:1px solid #dce5ef;border-radius:14px;padding:16px}.card img{width:100%;border-radius:8px;border:1px solid #dce5ef}.card h2{font-size:18px}@media(max-width:900px){.grid{grid-template-columns:1fr}}</style></head>
<body><header><h1>Prototipo visual - Sistema de Tickets EsSalud Pasco</h1><p>Pantallas del solicitante, técnico y administrador</p></header><main><div class="grid"><section class="card"><h2>Login</h2><img src="../mockups/MOCKUP-F5-001_Login.png"></section><section class="card"><h2>Dashboard del solicitante</h2><img src="../mockups/MOCKUP-F5-002_Dashboard_Solicitante.png"></section><section class="card"><h2>Registro de ticket</h2><img src="../mockups/MOCKUP-F5-003_Registro_Ticket.png"></section><section class="card"><h2>Mis tickets</h2><img src="../mockups/MOCKUP-F5-004_Mis_Tickets.png"></section><section class="card"><h2>Kanban del técnico</h2><img src="../mockups/MOCKUP-F5-005_Kanban_Tecnico.png"></section><section class="card"><h2>Detalle del ticket</h2><img src="../mockups/MOCKUP-F5-006_Detalle_Ticket.png"></section><section class="card"><h2>Dashboard administrativo</h2><img src="../mockups/MOCKUP-F5-007_Dashboard_Admin.png"></section><section class="card"><h2>Gestión de usuarios</h2><img src="../mockups/MOCKUP-F5-008_Gestion_Usuarios.png"></section><section class="card"><h2>Reportes</h2><img src="../mockups/MOCKUP-F5-009_Reportes.png"></section></div></main></body></html>
